openapi: 3.1.0
info:
  title: KTL 현장 서버 API (과제 B)
  version: 1.0.0
  description: |
    B-1(ktl-field-server)이 제공하고 B-2(ktl-field-web)가 쓴다.
    사람이 읽는 설명은 docs/02-API명세.md. 둘이 다르면 이 파일이 기준.
    휴대폰 API는 :8765 /api/v1, 관리 API는 127.0.0.1:8766 /api/admin/v1.
servers:
  - url: http://{host}:8765/api/v1
    description: 휴대폰 API
    variables: { host: { default: 192.168.8.10 } }
  - url: http://127.0.0.1:8766/api/admin/v1
    description: 관리 API (노트북 안에서만)
security:
  - client: []
    session: []
tags:
  - { name: auth, description: 단말 등록·로그인 }
  - { name: cases, description: 접수 건 }
  - { name: photos, description: 사진·판독값 }
  - { name: events, description: 실시간 알림 }
  - { name: admin, description: 관리 API 전용 (127.0.0.1:8766) }

paths:
  /clients/pair:
    post:
      tags: [auth]
      summary: 등록 코드로 단말 등록 (ktl_client 쿠키 발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pair_code, device_name]
              properties:
                pair_code: { type: string, pattern: '^\d{6}$', example: "483920" }
                device_name: { type: string, maxLength: 40, example: 현장폰-1 }
      responses:
        "200":
          description: 등록됨
          headers: { Set-Cookie: { schema: { type: string }, description: ktl_client=…; HttpOnly; SameSite=Strict } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } }
        "400": { $ref: '#/components/responses/Error' }
        "410": { $ref: '#/components/responses/Error' }

  /testers:
    get:
      tags: [auth]
      summary: 시험자 목록 (이름만)
      security: [ { client: [] } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Tester' } } } }
        "401": { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: (관리 API) 시험자 추가
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pin]
              properties:
                name: { type: string }
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses: { "201": { description: 추가됨, content: { application/json: { schema: { $ref: '#/components/schemas/Tester' } } } } }

  /sessions:
    post:
      tags: [auth]
      summary: 시험자 로그인 (ktl_session 쿠키 발급). 5회 실패 시 10분 잠금
      security: [ { client: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tester_id, pin]
              properties:
                tester_id: { type: string, example: ts_2 }
                pin: { type: string, pattern: '^\d{4,6}$', example: "1234" }
      responses:
        "200":
          description: 로그인됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  tester: { $ref: '#/components/schemas/Tester' }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: '#/components/responses/Error' }
        "423": { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: 로그아웃
      responses: { "204": { description: 로그아웃됨 } }

  /sessions/me:
    get:
      tags: [auth]
      summary: 현재 단말·시험자
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: '#/components/schemas/Client' }
                  tester: { $ref: '#/components/schemas/Tester' }
        "401": { $ref: '#/components/responses/Error' }

  /categories:
    get:
      tags: [cases]
      summary: 분류·촬영 항목·출력 칼럼 (categories.yaml)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } }

  /cases:
    get:
      tags: [cases]
      summary: 접수 건 목록
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, completed] } }
        - { name: q, in: query, schema: { type: string }, description: 접수번호 일부 }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [cases]
      summary: 새 접수 건
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt_no, category, unit_count]
              properties:
                receipt_no: { type: string, pattern: '^\d{2}-\d{6}-\d{2}$', example: 26-000123-01 }
                category: { type: string, example: sampling }
                unit_count: { type: integer, minimum: 1, maximum: 50, example: 2 }
                options: { type: object, additionalProperties: { type: string }, example: { flowmeter_type: defender } }
      responses:
        "201": { description: 생성됨, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        "400": { $ref: '#/components/responses/Error' }

  /cases/{case_id}:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    get:
      tags: [cases]
      summary: 접수 건 상세 (기기별·항목별 상태)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        "404": { $ref: '#/components/responses/Error' }

  /cases/{case_id}/complete:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    post:
      tags: [cases]
      summary: 건 완료. 미확정 값이 있으면 409 (detail.unconfirmed에 목록)
      responses:
        "200": { description: 완료됨, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        "409": { $ref: '#/components/responses/Error' }

  /cases/{case_id}/photos:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    get:
      tags: [photos]
      summary: 건의 사진 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Photo' } } } }
    post:
      tags: [photos]
      summary: 사진 업로드 → 원본 보관 후 즉시 queued. 같은 client_upload_id 재전송은 409 + 기존 사진
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, unit_index, item_key, client_upload_id]
              properties:
                file: { type: string, format: binary, description: 최대 20 MB, 원본 해상도 }
                unit_index: { type: integer, minimum: 1 }
                item_key: { type: string, example: prec_1 }
                client_upload_id: { type: string, format: uuid }
      responses:
        "202": { description: 접수됨, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        "409": { $ref: '#/components/responses/Error' }
        "413": { $ref: '#/components/responses/Error' }

  /photos/{photo_id}:
    parameters: [ { $ref: '#/components/parameters/photo_id' } ]
    get:
      tags: [photos]
      summary: 판독 상태·값·경고
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        "404": { $ref: '#/components/responses/Error' }
    delete:
      tags: [photos]
      summary: 다시 찍기 (소프트 삭제)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, example: 흐림 } } }
      responses: { "204": { description: 삭제됨 } }

  /photos/{photo_id}/image:
    parameters:
      - { $ref: '#/components/parameters/photo_id' }
      - { name: variant, in: query, schema: { type: string, enum: [original, rotated, thumb], default: thumb } }
    get:
      tags: [photos]
      summary: 이미지
      responses:
        "200": { description: JPEG, content: { image/jpeg: { schema: { type: string, format: binary } } } }

  /photos/{photo_id}/values:
    parameters: [ { $ref: '#/components/parameters/photo_id' } ]
    patch:
      tags: [photos]
      summary: 값 수정·확정. 바꾼 값은 reason 필수
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string }
                      value: { type: string }
                      reason: { type: string }
                confirm: { type: boolean, default: false }
      responses:
        "200": { description: 갱신됨, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        "400": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }

  /photos/{photo_id}/retry:
    parameters: [ { $ref: '#/components/parameters/photo_id' } ]
    post:
      tags: [photos]
      summary: 실패한 판독 다시
      responses: { "202": { description: 다시 queued, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } } }

  /events:
    get:
      tags: [events]
      summary: SSE 스트림. event = photo.status | photo.values | case.updated | merge.status | export.done
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/Event' } } }

  # ---------- 관리 API 전용 (servers[1]) ----------
  /pair-codes:
    post:
      tags: [admin]
      summary: 단말 등록 코드 발급 (5분 만료)
      security: []
      responses:
        "201":
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "483920" }
                  expires_at: { type: string, format: date-time }
                  qr_svg: { type: string, description: "QR 내용은 http://<IP>:8765/pair?code=483920" }

  /clients:
    get:
      tags: [admin]
      summary: 등록 단말 목록
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Client' } } } }

  /clients/{client_id}:
    parameters: [ { name: client_id, in: path, required: true, schema: { type: string } } ]
    delete:
      tags: [admin]
      summary: 단말 해제 (이후 요청 403)
      security: []
      responses: { "204": { description: 해제됨 } }

  /testers/{tester_id}:
    parameters: [ { name: tester_id, in: path, required: true, schema: { type: string } } ]
    patch:
      tags: [admin]
      summary: 시험자 수정 (이름, PIN 재설정, 잠금 해제, 비활성)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pin: { type: string, pattern: '^\d{4,6}$' }
                unlock: { type: boolean }
                active: { type: boolean }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tester' } } } } }

  /review-queue:
    get:
      tags: [admin]
      summary: 확인 필요(needs_check) 값 모아 보기
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        case_id: { type: string }
                        receipt_no: { type: string }
                        photo_id: { type: string }
                        unit_index: { type: integer }
                        item_key: { type: string }
                        value: { $ref: '#/components/schemas/Value' }

  /cases/{case_id}/reopen:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    post:
      tags: [admin]
      summary: 완료 건 다시 열기
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } } }

  /settings:
    get:
      tags: [admin]
      summary: 설정 조회
      security: []
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } }
    put:
      tags: [admin]
      summary: 설정 변경
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } } }

  /cases/{case_id}/files:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    post:
      tags: [admin]
      summary: 가스·라돈 파일 업로드 → 형식 판별
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataFile' } } } }

  /files/{file_id}/series:
    parameters: [ { name: file_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [admin]
      summary: 그래프용 시계열 (B-4 series())
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns: { type: array, items: { type: string }, example: [t, CH1] }
                  unit: { type: [string, "null"], example: PPB }
                  rows: { type: array, items: { type: array, items: {} } }

  /cases/{case_id}/merges:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    post:
      tags: [admin]
      summary: 선별/병합 실행 (비동기)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selector, file_ids]
              properties:
                selector: { type: string, enum: [gas_select, radon_merge] }
                file_ids: { type: array, items: { type: string } }
                options:
                  type: object
                  description: |
                    gas_select: { ranges: { ZDS: [시작, 끝], ZDE: …, SDS: …, SDE: …, LT: …, RZ1: …, … } }
                    radon_merge: { reference: file_id, align: sequence | hour }
      responses:
        "202": { description: 접수됨, content: { application/json: { schema: { $ref: '#/components/schemas/Merge' } } } }

  /merges/{merge_id}:
    parameters: [ { name: merge_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [admin]
      summary: 선별/병합 결과
      security: []
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Merge' } } } } }

  /cases/{case_id}/exports:
    parameters: [ { $ref: '#/components/parameters/case_id' } ]
    post:
      tags: [admin]
      summary: 내보내기 생성 (확정값만)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, format]
              properties:
                kind: { type: string, enum: [photo_values, merge_raw] }
                format: { type: string, enum: [csv, txt, xlsx] }
                encoding: { type: string, enum: [cp949, utf-8], default: cp949 }
                include_photos: { type: boolean, default: false }
                merge_id: { type: string, description: kind=merge_raw일 때 }
      responses:
        "202": { description: 접수됨, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }

  /exports/{export_id}:
    parameters: [ { name: export_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [admin]
      summary: 내보내기 상태 + 미리보기(앞 20행)
      security: []
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } } }

  /exports/{export_id}/download:
    parameters: [ { name: export_id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [admin]
      summary: 파일 받기 (csv/txt/xlsx 또는 zip)
      security: []
      responses: { "200": { description: 파일, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }

  /audit:
    get:
      tags: [admin]
      summary: 작업 로그 + 해시 체인 검증
      security: []
      parameters: [ { name: case_id, in: query, schema: { type: string } } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain_ok: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        at: { type: string, format: date-time }
                        actor: { type: string }
                        action: { type: string, example: value.edit }
                        target: { type: string }
                        detail: { type: object }
                        prev_hash: { type: string }
                        hash: { type: string }

components:
  securitySchemes:
    client: { type: apiKey, in: cookie, name: ktl_client }
    session: { type: apiKey, in: cookie, name: ktl_session }
  parameters:
    case_id: { name: case_id, in: path, required: true, schema: { type: string, example: case_12 } }
    photo_id: { name: photo_id, in: path, required: true, schema: { type: string, example: ph_301 } }
    limit: { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    cursor: { name: cursor, in: query, schema: { type: string } }
  responses:
    Error:
      description: 오류
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION, CLIENT_UNKNOWN, SESSION_REQUIRED, CLIENT_REVOKED, NOT_FOUND, DUPLICATE_UPLOAD,
                     CASE_COMPLETED, ALREADY_CONFIRMED, PAIR_CODE_EXPIRED, FILE_TOO_LARGE, PIN_LOCKED, INTERNAL]
            message: { type: string, description: 화면에 그대로 보여 줄 한국어 문장 }
            detail: { type: object }
    Client:
      type: object
      properties:
        client_id: { type: string, example: cl_3 }
        device_name: { type: string }
        paired_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
    Tester:
      type: object
      properties:
        id: { type: string, example: ts_2 }
        name: { type: string, example: 시험자B }
        locked: { type: boolean }
        active: { type: boolean }
    Category:
      type: object
      properties:
        category: { type: string, example: sampling }
        label: { type: string, example: 시료채취 }
        options:
          type: array
          items:
            type: object
            properties: { key: { type: string }, label: { type: string }, choices: { type: array, items: { type: string } } }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: prec_1 }
              label: { type: string, example: 정밀오차 1 }
              reader: { type: string, example: flowmeter, description: none이면 판독 없이 사진만 }
              required: { type: boolean }
        export: { type: array, items: { type: string } }
    CaseSummary:
      type: object
      properties:
        id: { type: string }
        receipt_no: { type: string }
        category: { type: string }
        unit_count: { type: integer }
        status: { type: string, enum: [open, completed] }
        progress: { type: object, properties: { total: { type: integer }, confirmed: { type: integer }, needs_check: { type: integer } } }
        updated_at: { type: string, format: date-time }
    Case:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            options: { type: object, additionalProperties: { type: string } }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
            units:
              type: array
              items:
                type: object
                properties:
                  index: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        required: { type: boolean }
                        photo_id: { type: [string, "null"] }
                        status: { type: string, enum: [empty, queued, reading, done, needs_check, confirmed, failed] }
    Value:
      type: object
      required: [key, label, value, status]
      properties:
        key: { type: string, example: flow }
        label: { type: string, example: 유량 }
        value: { type: string, example: "1.002" }
        unit: { type: [string, "null"], example: L/min }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bbox: { type: [array, "null"], items: { type: integer }, minItems: 4, maxItems: 4 }
        status: { type: string, enum: [auto, needs_check, confirmed, edited] }
        confirmed_by: { type: [string, "null"] }
        confirmed_at: { type: [string, "null"], format: date-time }
    Warning:
      type: object
      properties:
        code: { type: string, example: PRE_MEASURE_SCREEN }
        message: { type: string }
    Photo:
      type: object
      properties:
        id: { type: string }
        case_id: { type: string }
        unit_index: { type: integer }
        item_key: { type: string }
        reader: { type: string }
        status: { type: string, enum: [queued, reading, done, failed, deleted] }
        sha256: { type: string }
        stored_name: { type: string, example: 20261029_091102_prec_1.jpg }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        values: { type: array, items: { $ref: '#/components/schemas/Value' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
        error: { type: [string, "null"] }
        read_ms: { type: [integer, "null"] }
    DataFile:
      type: object
      properties:
        id: { type: string, example: file_7 }
        case_id: { type: string }
        name: { type: string }
        sha256: { type: string }
        detected:
          type: [object, "null"]
          description: B-4 detect() 결과. 모르는 형식이면 null
          properties:
            kind: { type: string, enum: [gas_gl240, radon_chamber, radon_frd400, radon_frd500, radon_frd2400] }
            serial: { type: string }
            interval_s: { type: integer }
            unit: { type: string }
            rows: { type: integer }
    Merge:
      type: object
      properties:
        id: { type: string }
        case_id: { type: string }
        selector: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        table:
          type: [object, "null"]
          properties:
            columns: { type: array, items: { type: string } }
            rows: { type: array, items: { type: array, items: {} } }
        meta: { type: object }
        warnings: { type: array, items: { $ref: '#/components/schemas/Warning' } }
        error: { type: [string, "null"] }
    Export:
      type: object
      properties:
        id: { type: string }
        case_id: { type: string }
        kind: { type: string }
        format: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        file_name: { type: [string, "null"], example: 26-000123-01_sampling_20261029-150301.csv }
        preview: { type: [object, "null"], properties: { columns: { type: array, items: { type: string } }, rows: { type: array, items: { type: array, items: {} } } } }
        skipped_unconfirmed: { type: integer, description: 미확정이라 빠진 값 수 }
    Settings:
      type: object
      properties:
        export_encoding: { type: string, enum: [cp949, utf-8], default: cp949 }
        photo_retention_days: { type: [integer, "null"], description: null이면 자동 삭제 안 함 }
        confidence_threshold: { type: number, default: 0.8 }
        read_timeout_s: { type: integer, default: 10 }
    Event:
      type: object
      description: "SSE data. event 이름은 photo.status | photo.values | case.updated | merge.status | export.done"
      properties:
        photo_id: { type: string }
        case_id: { type: string }
        unit_index: { type: integer }
        item_key: { type: string }
        id: { type: string }
        status: { type: string }
